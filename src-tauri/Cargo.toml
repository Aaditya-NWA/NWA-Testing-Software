[package]
name = "nwa-testing-software"
version = "1.0.0"
description = "NWA Testing Software — motor/ESC test bench"
authors = ["NWA"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nwa_testing_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: neither has meaning on mobile, and this is a Windows bench tool.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
